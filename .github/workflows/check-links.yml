name: Vérifier les liens des sources officielles
on:
  workflow_dispatch:
  schedule: [{cron: '17 6 * * 1'}]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          fail=0
          for u in $(grep -rhoE 'https://(www\.)?[a-z.]*(gov\.ma|idarati\.ma|maroc\.ma)[^"<) ]*' --include=*.html . | sort -u); do
            c=$(curl -sS -L -o /dev/null -m 30 -A "Mozilla/5.0 (Linux; Android 14) Chrome/130 Mobile" -w "%{http_code}" "$u" || true)
            echo "$c $u"; [ "$c" = "200" ] || { echo "::error::Lien source cassé : $u ($c)"; fail=1; }
          done
          exit $fail
